    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2310B981'/><circle cx='50' cy='50' r='32' fill='%23FACC15'/><path d='M40 32 L70 50 L40 68 Z' fill='%23064E3B'/></svg>" />
    <style>
      /* Reset & base styling */
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #FAFAFA;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #0F172A;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      * {
        box-sizing: border-box;
      }
      /* Custom smooth scrolling and scrollbar */
      html {
        scroll-behavior: smooth;
      }
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #F1F5F9;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, #10B981, #FACC15);
        border-radius: 6px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #059669;
      }

      /* Background Dot Matrix pattern */
      .bg-dots {
        background-image: radial-gradient(rgba(16, 185, 129, 0.12) 1.5px, transparent 1.5px);
        background-size: 24px 24px;
      }
      .bg-grid {
        background-image: 
          linear-gradient(to right, rgba(234, 179, 8, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
        background-size: 32px 32px;
      }

      /* Animated Glowing Border Beam */
      @keyframes borderGlow {
        0% { filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.3)); }
        50% { filter: drop-shadow(0 0 20px rgba(250, 204, 21, 0.5)); }
        100% { filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.3)); }
      }
      .glow-pulse {
        animation: borderGlow 4s ease-in-out infinite;
      }

      /* Infinite Seamless Horizontal Marquee */
      @keyframes marquee {
        0% { transform: translateX(0%); }
        100% { transform: translateX(-50%); }
      }
      .marquee-track {
        display: flex;
        width: 200%;
        animation: marquee 28s linear infinite;
      }
      .marquee-track:hover {
        animation-play-state: paused;
      }

      /* LED Pixel Texture Simulation */
      .led-pixel-overlay {
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 3px
        );
      }

      /* Shimmer Highlight */
      @keyframes shimmer {
        100% { transform: translateX(100%); }
      }
      .shimmer-badge {
        position: relative;
        overflow: hidden;
      }
      .shimmer-badge::after {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0,
          rgba(255, 255, 255, 0.5) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: shimmer 3s infinite;
        content: '';
      }
    </style>
