    <style>
      /* PodPolite-inspired architectural styling */
      :root {
        --fg: #090907;
        --bg: #FFFFFF;
        --canvas: #FBFBFA;
        --muted: #666660;
        --hairline: rgba(9, 9, 7, 0.1);
        --action: #059669;
        --action-hover: #047857;
        --amber: #D97706;
        --amber-soft: #FEF9C3;
      }

      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: var(--bg);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      * {
        box-sizing: border-box;
      }

      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      .font-serif {
        font-family: 'Newsreader', serif;
      }

      ::selection {
        background-color: #D1FAE5;
        color: #064E3B;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F8F8F7;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8;
      }

      /* Infinite Seamless Horizontal Marquee */
      @keyframes marquee {
        0% { transform: translateX(0%); }
        100% { transform: translateX(-50%); }
      }
      .marquee-track {
        display: flex;
        width: 200%;
        animation: marquee 30s linear infinite;
      }
      .marquee-track:hover {
        animation-play-state: paused;
      }

      /* Subtle driving road */
      @keyframes roadMove {
        0% { background-position: 0 0; }
        100% { background-position: -60px 0; }
      }
      .animated-road {
        background-image: repeating-linear-gradient(
          to right,
          #FACC15 0,
          #FACC15 24px,
          transparent 24px,
          transparent 48px
        );
        background-size: 48px 3px;
        background-repeat: repeat-x;
        background-position: bottom 4px center;
        animation: roadMove 0.8s linear infinite;
      }

      /* Rotating Wheels */
      @keyframes wheelSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .rotating-wheel {
        animation: wheelSpin 0.7s linear infinite;
      }

      /* Radar Ping Ring */
      @keyframes pingRing {
        0% { transform: scale(0.9); opacity: 0.9; }
        100% { transform: scale(2.2); opacity: 0; }
      }
      .radar-ping {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid #10B981;
        animation: pingRing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      /* Shimmer Highlight */
      @keyframes shimmer {
        100% { transform: translateX(100%); }
      }
      .shimmer-badge {
        position: relative;
        overflow: hidden;
      }
      .shimmer-badge::after {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0,
          rgba(255, 255, 255, 0.5) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: shimmer 3s infinite;
        content: '';
      }
    </style>
