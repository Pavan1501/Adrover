<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adover — Transit Media Study & LED Broadcast Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%2310B981'/><circle cx='50' cy='50' r='32' fill='%23FACC15'/><path d='M40 32 L70 50 L40 68 Z' fill='%23064E3B'/></svg>" />
    <style>
      /* PodPolite-inspired architectural styling */
      :root {
        --fg: #090907;
        --bg: #FFFFFF;
        --canvas: #FBFBFA;
        --muted: #666660;
        --hairline: rgba(9, 9, 7, 0.1);
        --action: #059669;
        --action-hover: #047857;
        --amber: #D97706;
        --amber-soft: #FEF9C3;
      }

      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: var(--bg);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      * {
        box-sizing: border-box;
      }

      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      .font-serif {
        font-family: 'Newsreader', serif;
      }

      ::selection {
        background-color: #D1FAE5;
        color: #064E3B;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F8F8F7;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8;
      }

      /* Infinite Seamless Horizontal Marquee */
      @keyframes marquee {
        0% { transform: translateX(0%); }
        100% { transform: translateX(-50%); }
      }
      .marquee-track {
        display: flex;
        width: 200%;
        animation: marquee 32s linear infinite;
      }
      .marquee-track:hover {
        animation-play-state: paused;
      }

      @keyframes marqueeReverse {
        0% { transform: translateX(-50%); }
        100% { transform: translateX(0%); }
      }
      .marquee-track-reverse {
        display: flex;
        width: 200%;
        animation: marqueeReverse 36s linear infinite;
      }
      .marquee-track-reverse:hover {
        animation-play-state: paused;
      }

      /* Subtle driving road */
      @keyframes roadMove {
        0% { background-position: 0 0; }
        100% { background-position: -60px 0; }
      }
      .animated-road {
        background-image: repeating-linear-gradient(
          to right,
          #FACC15 0,
          #FACC15 24px,
          transparent 24px,
          transparent 48px
        );
        background-size: 48px 3px;
        background-repeat: repeat-x;
        background-position: bottom 4px center;
        animation: roadMove 0.8s linear infinite;
      }

      /* Rotating Wheels */
      @keyframes wheelSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .rotating-wheel {
        animation: wheelSpin 0.7s linear infinite;
      }

      /* Radar Ping Ring */
      @keyframes pingRing {
        0% { transform: scale(0.9); opacity: 0.9; }
        100% { transform: scale(2.2); opacity: 0; }
      }
      .radar-ping {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid #10B981;
        animation: pingRing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      /* Shimmer Highlight */
      @keyframes shimmer {
        100% { transform: translateX(100%); }
      }
      .shimmer-badge {
        position: relative;
        overflow: hidden;
      }
      .shimmer-badge::after {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0,
          rgba(255, 255, 255, 0.5) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: shimmer 3s infinite;
        content: '';
      }

      /* Floating Badges */
      @keyframes floatBadge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .float-badge {
        animation: floatBadge 3s ease-in-out infinite;
      }
      .float-badge-delayed {
        animation: floatBadge 3.6s ease-in-out infinite 0.8s;
      }

      /* Truck Suspension Rumble */
      @keyframes truckRumble {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2px); }
      }
      .truck-rumble {
        animation: truckRumble 1.4s ease-in-out infinite;
      }

      /* Glow Pulse */
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 15px 30px rgba(16, 185, 129, 0.18)); }
        50% { filter: drop-shadow(0 20px 40px rgba(16, 185, 129, 0.32)); }
      }
      .glow-pulse {
        animation: glowPulse 2.8s ease-in-out infinite;
      }

      /* Laser Scanline Beam */
      @keyframes laserScan {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(260px); }
      }
      .laser-scan-line {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #10B981, #FACC15, transparent);
        box-shadow: 0 0 12px #10B981;
        animation: laserScan 2.4s linear infinite;
        pointer-events: none;
        z-index: 5;
      }

      /* Subtle LED Pixel Grid Overlay */
      .led-pixel-overlay::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 0);
        background-size: 4px 4px;
        pointer-events: none;
        z-index: 1;
      }

      /* Geometric Backgrounds */
      .bg-dots {
        background-image: radial-gradient(rgba(15, 23, 42, 0.08) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .bg-grid {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(226, 232, 240, 0.5) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(226, 232, 240, 0.5) 1px, transparent 1px);
      }

      /* Flow Conduit Connector */
      @keyframes flowLight {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      .flow-conduit {
        background: linear-gradient(90deg, #10B981, #FACC15, #10B981);
        background-size: 200% auto;
        animation: flowLight 2.2s linear infinite;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BvB0wBpy.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
